<!DOCTYPE html>
<html>
    <head>
        <meta chartset="UTF-8">
        <meta name="description" content="This is a cat photo app">
        <title>CatPhotoApp</title>
    </head>
    <body>
        <h2>CatPhotoApp</h2>
        <main>
            <h3>Cat Photos</h3>

            <!-- TODO: Add link to cat photos -->
            <p>Cat photos</p>

            <img src="cat.jpg" alt="a cat lying on its back">
            <!-- Link to cat photo: https://bit.ly/fcc-relaxing-cat-->

            <h3>Cat Lists</h3>

            <p>Things cats love:</p>
            <ul>
                <li>cat nip</li>
                <li>laser pointers</li>
                <li>lesagna</li>
            </ul>

            <img src="lesagna.jpeg" alt="a lesagna">

            <p>Things cats hate:</p>
            <ol>
                <li>flea treatment</li>
                <li>thunder</li>
                <li>other cats</li>
            </ol>

            <img src="four cats.jpeg" alt="four cute kittens">

            <form>
                <label for="indoor"><input id="indoor" type="radio" name="indoor-outdoor" checked>indoor</label><br>
                <label for="outdoor"><input id="outdoor" type="radio" name="indoor-outdoor">outdoor</label><br>

                <label for="loving"><input id="loving" type="checkbox" name="personality" checked>Loving</label><br>
                <label for="lazy"><input id="lasy" type="checkbox" name="personality">Lazy</label><br>
                <label for="energetic"><input id="energetic" type="checkbox" name="personality">Energetic</label><br>

                <p>Cat Photo URL:</p>
                <input type="text" placeholder="cat photo URL" required><br>
                <button type="submit">Submit</button>

            </form>
            
            <footer>
                <p><small>No copyright</small> <a href="https://thinkcommunity-tc.com">thinkcommunity-tc.com</a></p>
            </footer>
        </main>
    </body>
</html>
